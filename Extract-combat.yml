name: Extract CrimsonCombat ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "CrimsonCombat_OneDrop.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o CrimsonCombat_OneDrop.zip -d extracted

      - name: Put files in repository
        run: |
          rm -rf CrimsonCombat

          # If the ZIP already contains a CrimsonCombat_OneDrop folder,
          # copy its contents into CrimsonCombat/.
          if [ -d "extracted/CrimsonCombat_OneDrop" ]; then
            mkdir -p CrimsonCombat
            cp -R extracted/CrimsonCombat_OneDrop/. CrimsonCombat/
          else
            mkdir -p CrimsonCombat
            cp -R extracted/. CrimsonCombat/
          fi

          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CrimsonCombat

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Extract CrimsonCombat ZIP"
            git push
          fi

name: Extract CrimsonCombat Runtime

on:
  push:
    paths:
      - "CrimsonCombat_StandaloneRuntime.zip"
      - ".github/workflows/extract.yml"
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract runtime ZIP
        run: |
          rm -rf CrimsonCombat
          mkdir -p CrimsonCombat
          unzip -o CrimsonCombat_StandaloneRuntime.zip -d CrimsonCombat

      - name: Show extracted files
        run: |
          echo "=== Extracted CrimsonCombat ==="
          find CrimsonCombat -type f -print

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CrimsonCombat

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract CrimsonCombat standalone runtime"
            git push
          fi
